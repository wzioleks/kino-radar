[project]
name = "kino-radar"
version = "0.1.0"
description = "Repertuary kin w Gdańsku × publiczna watchlista Letterboxd → statyczny kalendarz HTML."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
kino-radar = "kino_radar.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
